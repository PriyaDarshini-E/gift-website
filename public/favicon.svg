<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Rich Emerald Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E3E2B" />
      <stop offset="50%" stopColor="#122B1D" />
      <stop offset="100%" stopColor="#08180F" />
    </linearGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF2B2" />
      <stop offset="35%" stopColor="#F5D061" />
      <stop offset="70%" stopColor="#D4AF37" />
      <stop offset="100%" stopColor="#9E7412" />
    </linearGradient>

    <!-- Outer Border Gold Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#D4AF37" />
      <stop offset="50%" stopColor="#FFF5C2" />
      <stop offset="100%" stopColor="#B3861B" />
    </linearGradient>

    <!-- Drop Shadow Filter for Sharp Clarity -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle / Shield Container -->
  <rect x="4" y="4" width="92" height="92" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Octagonal Crest Line -->
  <polygon points="50,14 82,27 86,60 64,84 36,84 14,60 18,27" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="2 1.5" opacity="0.6" />

  <!-- Crown Ribbon Bow at Top -->
  <!-- Left Ribbon Loop -->
  <path d="M50 25 C43 16, 32 17, 36 26 C40 31, 48 28, 50 26 Z" fill="url(#goldGrad)" />
  <!-- Right Ribbon Loop -->
  <path d="M50 25 C57 16, 68 17, 64 26 C60 31, 52 28, 50 26 Z" fill="url(#goldGrad)" />
  <!-- Ribbon Center Knot Gem -->
  <circle cx="50" cy="26" r="3" fill="#FFF2B2" stroke="#8A630E" stroke-width="0.8" />

  <!-- Top Star Sparkle -->
  <path d="M50 13 L51 16.5 L54.5 17.5 L51 18.5 L50 22 L49 18.5 L45.5 17.5 L49 16.5 Z" fill="#FFF2B2" />

  <!-- Stylized Monogram 'M' and 'C' -->
  <!-- 'M' Monogram Path -->
  <path d="M29 68 V38 L50 54 L71 38 V68" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Intertwined 'C' Crest Path -->
  <path d="M65 44 C59 36, 41 36, 37 52 C33 66, 51 72, 63 66" stroke="url(#goldGrad)" stroke-width="3.8" stroke-linecap="round" opacity="0.95" filter="url(#shadow)" />

  <!-- Central Diamond Sparkle Jewel -->
  <polygon points="50,60 52.5,64.5 50,69 47.5,64.5" fill="url(#goldGrad)" />
</svg>